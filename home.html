<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - School Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="home-container">
        <h1>Welcome Back!</h1>
        <p id="welcome-message"></p>
        <button onclick="goToMainPage()">Go to Main Page</button>
        <button onclick="logout()">Logout</button>
    </div>

    <script>
        let user = JSON.parse(localStorage.getItem("loggedInUser"));
        if (!user) {
            window.location.href = "login.html";
        } else {
            document.getElementById("welcome-message").innerText = `Hello, ${user.username} (${user.role})`;
        }

        function goToMainPage() {
            window.location.href = "teachers_main.html";
        }

        function logout() {
            localStorage.removeItem("loggedInUser");
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
